{% extends "base.html" %}
{% block title %}Link Item to Vendor{% endblock %}

{% block content %}
<p class="page-heading">Link Item to Vendor</p>
<p class="page-sub">Define costs and package sizes for ordering.</p>

<div class="card" style="max-width: 600px;">
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: 600; margin-bottom: 5px;">Select Vendor</label>
            <select name="vendor" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                {% for v in vendors %}
                    <option value="{{ v.id }}">{{ v.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: 600; margin-bottom: 5px;">Select Item</label>
            <select name="item" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                {% for i in items %}
                    <option value="{{ i.id }}">{{ i.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div>
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">Cost per Order ($)</label>
                <input type="number" step="0.01" name="cost_per_order" placeholder="24.99" required
                       style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">Units per Order</label>
                <input type="number" name="amount_received_per_order" placeholder="24" required
                       style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn-save">Create Connection</button>
            <a href="{% url 'vendors:vendor_list' %}" style="padding: 10px; color: #666; text-decoration: none; font-size: 0.9rem;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
