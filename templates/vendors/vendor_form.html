{% extends "base.html" %}
{% block title %}{% if vendor %}Edit{% else %}Add{% endif %} Vendor{% endblock %}

{% block content %}
<p class="page-heading">{% if vendor %}Edit {{ vendor.name }}{% else %}Add New Vendor{% endif %}</p>

<div class="card" style="max-width: 600px;">
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: 600; margin-bottom: 5px;">Vendor Name</label>
            <input type="text" name="name" value="{{ vendor.name|default:'' }}" required
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: 600; margin-bottom: 5px;">Website URL</label>
            <input type="url" name="website" value="{{ vendor.website|default:'' }}" placeholder="https://..."
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: 600; margin-bottom: 5px;">Contact / Notes</label>
            <textarea name="contact_info" rows="3"
                      style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit;">{{ vendor.contact_info|default:'' }}</textarea>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn-save">Save Vendor</button>
            <a href="{% url 'vendors:vendor_list' %}" style="padding: 10px; color: #666; text-decoration: none; font-size: 0.9rem;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
