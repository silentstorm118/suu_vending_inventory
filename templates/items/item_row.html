<tr id="item-row-{{ item.id }}">
    <td><strong>{{ item.name }}</strong></td>
    <td>{{ item.level_in_backroom }}</td>
    <td>{{ item.level_in_machines }}</td>
    <td>
        {% if item.is_out %}
            <span class="badge" style="background-color: #dc3545; color: white; padding: 2px 4px; border-radius: 4px; font-size: 0.7rem; font-weight: 600;">
                No Stock
            </span>
        {% elif item.is_low %}
            <span class="badge badge--warning">Low Stock</span>
        {% else %}
            <span class="badge badge--online">OK</span>
        {% endif %}
    </td>
    <td>
        <form hx-post="{% url 'items:update_backroom' item.id %}"
              hx-target="#item-row-{{ item.id }}"
              hx-swap="outerHTML"
              style="display: flex; gap: 8px; align-items: center;">
            {% csrf_token %}
            <input type="number" name="adjustment" placeholder="+/-" required
                   style="width: 65px; padding: 6px; border: 1px solid #e1e1e1; border-radius: 6px; font-size: 0.8rem; font-family: inherit;">

            <button type="submit"
                    style="background-color: blue; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap;">
                Update
            </button>
        </form>
    </td>
    <td style="font-family: 'DM Mono', monospace; font-size: 0.68rem; color: #9a9590;">
        {{ item.updated_at|date:"M d, H:i" }}
    </td>
</tr>
